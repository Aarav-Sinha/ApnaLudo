  const d=[[-.8,0],[0,-.8],[.8,0],[0,.8]][s],o=(t-1.5)*.26;return[7.5+d[0]+(d[0]?0:o),7.5+d[1]+(d[1]?0:o)]}
function draw(pos,mv){const m={},key=(s,p)=>p<=50?'a'+(s*13+p)%52:'h'+s+p;
  G.seats.forEach(s=>pos[s].forEach((p,t)=>{if(p>=0&&p<56)(m[key(s,p)]=m[key(s,p)]||[]).push(s*4+t)}));
  G.seats.forEach(s=>pos[s].forEach((p,t)=>{let[x,y]=xy(s,t,p),k=1;
    if(p==56)k=.5;else if(p>=0){const g=m[key(s,p)];if(g.length>1){k=.62;const i=g.indexOf(s*4+t)%4;x+=[-.2,.2,-.2,.2][i];y+=[-.2,-.2,.2,.2][i]}}
    const e=toks[s][t];e.style.transform=`translate(${x}px,${y}px) scale(${k})`;e.classList.toggle('mv',s==G.cur&&mv.includes(t))}))}
const PIN='M0 .42C-.08 .24-.33 .14-.33-.1a.33 .33 0 0 1 .66 0C.33 .14 .08 .24 0 .42Z';
function initTokens(){toks={};G.seats.forEach(s=>{toks[s]=[0,1,2,3].map(t=>{const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  g.innerHTML=`<circle r=".55" fill="transparent"/><ellipse cy=".36" rx=".3" ry=".11" fill="#0006"/><path d="${PIN}" fill="${C[s]}" stroke="#fff" stroke-width=".05"/><path d="${PIN}" fill="url(#g${s})"/><circle cy="-.1" r=".13" fill="#fff" fill-opacity=".85"/>
<g class="orb"><circle r=".6" fill="none" stroke="#000" stroke-opacity=".55" stroke-width=".17"/><circle r=".6" fill="none" stroke="#e040fb" stroke-width=".11" stroke-dasharray=".4 .25"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/></circle><g><circle cx=".6" r=".12" fill="#ffee58" stroke="#000" stroke-width=".04"/><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur=".9s" repeatCount="indefinite"/></g></g>`;
  g.onpointerdown=e=>{e.preventDefault();userMove(s,t)};tk.append(g);return g})})}
// ---------- dice ----------
const FACE=[[],[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]];
function setDice(sd,n){$('dc'+sd).innerHTML=`<svg viewBox="0 0 100 100"><rect x="4" y="4" width="92" height="92" rx="20" fill="#fff" stroke="${C[sd]}" stroke-width="8"/><rect x="12" y="12" width="76" height="76" rx="14" fill="none" stroke="#0002" stroke-width="3"/>${FACE[n].map(i=>`<circle cx="${25+i%3*25}" cy="${25+(i/3|0)*25}" r="9" fill="${n==1?'#e53935':'#222'}"/>`).join('')}</svg>`}
async function rollAnim(sd,n){const b=$('dc'+sd);b.classList.add('roll');for(let i=0;i<8;i++){setDice(sd,rng());beep(300+i*25,.04);await sleep(75)}b.classList.remove('roll');setDice(sd,n)}
// ---------- show / queue ----------
const isMine=()=>mode=='pass'||G.cur==mySeat;
function enqueue(s){const g=gen;pend++;q=q.then(()=>g==gen&&show(s,g)).catch(console.error).then(()=>{if(g==gen){pend--;tick()}})}
async function show(s,g){G=s;const L=s.last;
  if(s.r){await rollAnim(s.cur,s.dice);if(s.dice==6)sfx('six')}
  if(g!=gen)return;
  if(L){const tmp=clone(sp),e=toks[L.seat][L.t];tk.append(e);
    if(L.from<0){tmp[L.seat][L.t]=0;draw(tmp,[]);sfx('open');await sleep(260)}
    else for(let p=L.from+1;p<=L.to;p++){tmp[L.seat][L.t]=p;draw(tmp,[]);beep(380+p*3,.04);await sleep(150)}
    const ab=(L.seat*13+L.to)%52,vb=p=>navigator.vibrate&&navigator.vibrate(p);
    if(L.cut){sfx('cut');vb(150)}else if(L.to==56){sfx('home');vb([60,40,60])}else if(L.to>50&&L.from<=50)sfx('col');else if(L.from>=0&&L.to<=50&&S.includes(ab))sfx('safe')}
  sp=s.pos;draw(s.pos,s.phase=='move'?legal(s):[]);ui(s);
  if(s.phase=='nomove')sfx('bad');
  if(s.phase=='over'){if(mode!='pass')record(s);over(s)}}
function ui(s){const me=isMine();
  s.seats.forEach(i=>{const on=i==s.cur&&s.phase!='over';$('pn'+i).classList.toggle('on',on);
    $('pnm'+i).textContent=(mode=='cpu'&&i!=mySeat?'🤖 ':'')+s.names[i];$('pst'+i).textContent=`🏠${s.pos[i].filter(p=>p==56).length}/4  ⭐${pts(s,i)}`;
    $('dc'+i).classList.toggle('pl',on&&s.phase=='roll'&&me);setDice(i,s.dv[i])});
  const n=s.names[s.cur],m=$('msg');m.style.borderColor=C[s.cur];
  m.textContent=s.phase=='over'?'Game over!':s.msg||(s.phase=='roll'?(me?(mode=='pass'?n+': ':'')+'Tap your dice 🎲':n+' is rolling…'):s.phase=='move'?(me?'Tap a glowing token':n+' is choosing…'):'')}
function over(s){const won=mode=='pass'||s.winners[0]==mySeat;$('ov').innerHTML=`<h1 class="pop">${won?(mode=='pass'?s.names[s.winners[0]]+' Wins!':'You Win!')+' 🏆':'🏁 Game Over'}</h1>`+s.winners.map((x,i)=>`<div class="chip on" style="--c:${C[x]};font-size:22px">${['🥇','🥈','🥉','4️⃣'][i]} ${s.names[x]} · ⭐${pts(s,x)}</div>`).join('')+(mode=='online'?'':'<button class="btn g" onclick="startLocal(N)">Play Again</button>')+'<button class="btn" onclick="mode==\'online\'?exitOnline():goMenu()">Main Menu</button>';$('ov').classList.add('on');if(won){sfx('win');confetti()}else sfx('lose')}
// ---------- actions ----------
function commit(s){shownV=s.v;enqueue(s);if(mode=='online')DB.ref('rooms/'+room+'/state').set(s).catch(()=>toast('Connection problem'))}
function userRoll(sd){if(pend||!G||G.phase!='roll'||!isMine()||sd!=G.cur)return;commit(rollState(clone(G),rng()))}
function userMove(s,t){if(pend||!G||G.phase!='move'||!isMine()||s!=G.cur||!legal(G).includes(t))return;commit(moveState(clone(G),t))}
function later(ms,fn){const v=G.v,g=gen;clearTimeout(T);T=setTimeout(()=>{if(g==gen&&!pend&&G.v==v)fn()},ms)}
function tick(){if(pend||!G||G.phase=='over')return;const ai=mode=='cpu'&&G.cur!=mySeat;if(mode=='online'&&G.cur!=mySeat)return;
  if(G.phase=='nomove')return later(1100,()=>commit(nextTurn(clone(G))));
  if(G.phase=='roll'&&ai)return later(700+Math.random()*500,()=>commit(rollState(clone(G),rng())));
  if(G.phase=='move'){const L=legal(G);if(ai)later(650+Math.random()*400,()=>commit(moveState(clone(G),pick(G))));else if(L.length==1)later(550,()=>commit(moveState(clone(G),L[0])))}}
const pn=s=>`<div class="pn${s==1||s==2?' r':''}" id="pn${s}" style="--c:${C[s]}"><button class="dc" id="dc${s}" aria-label="dice"></button><div><b id="pnm${s}"></b><br><small id="pst${s}"></small></div></div>`;
function startGame(s){gen++;pend=0;q=Promise.resolve();clearTimeout(T);G=s;go('game');$('top').innerHTML=pn(0)+pn(1);$('bot').innerHTML=pn(3)+pn(2);
  [0,1,2,3].forEach(i=>{if(s.seats.includes(i)){setDice(i,0);$('dc'+i).onpointerdown=e=>{e.preventDefault();userRoll(i)}}else $('pn'+i).style.visibility='hidden'});
  $('bd').innerHTML=board();tk=$('tk');initTokens();sp=s.pos;shownV=s.v;enqueue(s)}
function startLocal(n){N=n;const me=mode=='cpu'?myCol:0,seats=(n==2?[me,(me+2)%4]:n==3?[me,(me+1)%4,(me+2)%4]:[0,1,2,3]).sort(),names=['','','',''];
  seats.forEach(i=>names[i]=mode=='cpu'?(i==me?'You':'CPU '+CN[i]):CN[i]);mySeat=me;startGame(newGame(seats,names,mode=='cpu'?me:seats[0]))}
function leave(){if(!confirm('Leave this game?'))return;gen++;clearTimeout(T);mode=='online'?exitOnline():goMenu()}
// ---------- online ----------
const code5=()=>Array.from(crypto.getRandomValues(new Uint8Array(5)),b=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b%32]).join('');
async function create(){const b=$('cb');if(b.disabled)return;b.disabled=true;try{for(;;){const c=code5(),r=DB.ref('rooms/'+c);if(!(await r.get()).exists()){await r.set({host:U.uid,status:'lobby',players:{[U.uid]:{seat:0,name:nm()}}});return lobby(c)}}}catch(e){toast('Could not create room')}finally{b.disabled=false}}
async function join(){const b=$('jb'),c=$('code').value.trim().toUpperCase();if(b.disabled)return;if(c.length!=5)return toast('Enter the 5-letter code');b.disabled=true;
  try{const r=DB.ref('rooms/'+c),x=await r.get();if(!x.exists())return toast('Room not found');const v=x.val();
    if(!(v.players||{})[U.uid]){if(v.status!='lobby')return toast('Game already started');
      const t=await r.child('players').transaction(p=>{p=p||{};if(p[U.uid])return p;const used=Object.values(p).map(a=>a.seat),sd=[0,2,1,3].find(i=>!used.includes(i));if(sd==null)return;p[U.uid]={seat:sd,name:nm()};return p});
      if(!t.committed)return toast('Room is full')}
    lobby(c)}catch(e){toast('Could not join room')}finally{b.disabled=false}}
function lobby(c){room=c;gameRoom=null;go('lobby');$('rc').textContent=c;const r=DB.ref('rooms/'+c);
  const h=r.on('value',snap=>{const d=snap.val();if(!d)return;const ps=Object.values(d.players||{}).sort((a,b)=>a.seat-b.seat);mySeat=(d.players[U.uid]||{}).seat;
    $('pl').innerHTML=ps.map(p=>`<span class="chip" style="--c:${C[p.seat]};font-size:18px"><i style="background:${C[p.seat]}"></i>${p.name}</span>`).join('');
    const host=d.host==U.uid;$('st').style.display=host&&ps.length>1&&d.status=='lobby'?'':'none';
    $('wt').textContent=host?(ps.length<2?'Waiting for friends to join…':'Ready! Press Start'):'Waiting for host to start…';
    if(d.state){const s=d.state;s.winners=s.winners||[];if(gameRoom!=c){gameRoom=c;startGame(s)}else if(s.v>shownV){shownV=s.v;enqueue(s)}}});
  off=()=>r.off('value',h)}
async function startOnline(){const b=$('st');b.disabled=true;try{const x=(await DB.ref('rooms/'+room).get()).val(),pl=x.players,ids=Object.keys(pl);if(ids.length==2&&Math.abs(pl[ids[0]].seat-pl[ids[1]].seat)!=2)pl[ids[1]].seat=(pl[ids[0]].seat+2)%4;const ps=Object.values(pl),names=['','','',''];ps.forEach(p=>names[p.seat]=p.name);
  await DB.ref('rooms/'+room).update({status:'playing',players:pl,state:newGame(ps.map(p=>p.seat).sort(),names)})}catch(e){toast('Could not start')}b.disabled=false}
function exitOnline(){off&&off();off=0;gen++;clearTimeout(T);gameRoom=room=null;goMenu()}
</script></body></html>
