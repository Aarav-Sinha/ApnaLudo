<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Apna Ludo – Login</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;font-family:system-ui,sans-serif;color:#fff;background:radial-gradient(circle at 50% 0,#3b2a6b,#14102b 70%)}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:20px}
h1{font-size:48px;margin:0;background:linear-gradient(#ffd54f,#ff8f00);-webkit-background-clip:text;color:transparent}
p{font-size:20px;opacity:.85;margin:0}
button{display:flex;align-items:center;gap:14px;font-size:24px;font-weight:700;padding:18px 28px;border:0;border-radius:18px;background:#fff;color:#333;box-shadow:0 6px 0 #0006}
button:active{transform:translateY(4px)}button:disabled{opacity:.6}
#e{color:#ff8a80;min-height:24px;font-size:17px}
.credit{position:fixed;bottom:10px;left:0;right:0;font-size:13px;opacity:.75;letter-spacing:.5px}.credit b{color:#ffd54f}
</style></head><body>
<svg width="140" height="140" viewBox="0 0 140 140"><rect x="8" y="8" width="124" height="124" rx="22" fill="#fff"/><rect x="8" y="8" width="62" height="62" rx="22" fill="#e53935"/><rect x="70" y="8" width="62" height="62" rx="22" fill="#43a047"/><rect x="70" y="70" width="62" height="62" rx="22" fill="#fdd835"/><rect x="8" y="70" width="62" height="62" rx="22" fill="#1e88e5"/><circle cx="70" cy="70" r="26" fill="#fff"/><circle cx="70" cy="70" r="16" fill="#ff8f00"/></svg>
<h1>Apna Ludo</h1><p>Sign in once, play forever.</p>
<button id="gb"><svg width="28" height="28" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.5-4.2 7-10.3 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.100 0 24s.9 7.600 2.600 10.800l7.900-6.100z"/><path fill="#34A853" d="M24 48c6.500 0 12-2.100 16-5.800l-7.600-5.900c-2.100 1.400-4.900 2.300-8.400 2.300-6.300 0-11.600-4.100-13.500-9.800l-7.900 6.100C6.500 42.600 14.600 48 24 48z"/></svg>Continue with Google</button>
<div id="e"></div>
<div class="credit">Developed by <b>Aarav Sinha</b></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyAxHh83RsFuK6lOAn9nXisC1ZvTZj8P1DY",authDomain:"ludo-aarav.firebaseapp.com",projectId:"ludo-aarav",storageBucket:"ludo-aarav.firebasestorage.app",messagingSenderId:"995912279190",appId:"1:995912279190:web:4adfd72f7eed260298ceb7"});
const A=firebase.auth(),$=i=>document.getElementById(i),err=t=>$('e').textContent=t;
let busy=0;
A.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
A.onAuthStateChanged(u=>{if(u)location.replace('index.html')});
$('gb').onclick=async()=>{
  if(busy)return;busy=1;$('gb').disabled=true;err('');
  const p=new firebase.auth.GoogleAuthProvider();
  try{await A.signInWithPopup(p)}catch(e){
    if(e.code=='auth/popup-blocked')err('Popup was blocked. Please allow popups and try again.');
    else if(!['auth/popup-closed-by-user','auth/cancelled-popup-request'].includes(e.code))err('Sign-in failed. Please try again.');
    busy=0;$('gb').disabled=false;
  }
};
</script></body></html>
